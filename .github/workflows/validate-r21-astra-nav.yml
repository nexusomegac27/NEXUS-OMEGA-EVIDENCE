name: Validate R21 ASTRA-NAV source and photo zoom foundations

on:
  pull_request:
    paths:
      - 'docs/r21/**'
      - 'research/r21/**'
      - 'examples/r21/**'
      - 'tests/r21/**'
      - 'schema/r21/**'
      - '.github/workflows/validate-r21-astra-nav.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zoom-provenance-and-offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check zoom adapter syntax
        run: node --check examples/r21/orbis-astra-nav-photo-lod.mjs
      - name: Check R21.2 GSD truth UI reference syntax
        run: node --check examples/r21/orbis-gsd-truth-ui.mjs
      - name: Check R21.1 provenance atom validator syntax
        run: node --check examples/r21/nexus-provenance-atom.mjs
      - name: Run reference negative fixtures
        run: node --test tests/r21/orbis-astra-nav-photo-lod.test.mjs
      - name: Run R21.2 GSD truth UI fixtures
        run: node --test tests/r21/orbis-gsd-truth-ui.test.mjs
      - name: Run R21.1 provenance atom fail-closed fixtures
        run: node --test tests/r21/nexus-provenance-atom.test.mjs
      - name: Check provenance atom JSON schema parses
        run: node --input-type=module -e "import fs from 'node:fs'; JSON.parse(fs.readFileSync('schema/r21/nexus-provenance-atom-v1.schema.json','utf8'));"
      - name: Check machine-readable source register
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('research/r21/orbis-astra-nav-primary-source-register.json','utf8'));if(!Array.isArray(x.candidates)||x.candidates.length<10)process.exit(1);if(x.candidates.some(c=>!c.documentation||!c.license_reference||c.vendor_ingested!==false))process.exit(2)"
      - name: Check R21 P0 browser map and data model syntax
        run: |
          node --check examples/r21/astra-nav-p0/app.mjs
          node --check examples/r21/astra-nav-p0/ui-model.mjs
      - name: Run R21 P0 map and satellite guard tests
        run: node --test tests/r21/orbis-astra-nav-p0-surface.test.mjs
      - name: Check R21R1 module syntax
        run: |
          node --check examples/r21/r21r1/nexus-nav-fix.mjs
          node --check examples/r21/r21r1/offline-pack.mjs
          node --check examples/r21/r21r1/photo-tile-provenance.mjs
          node --check examples/r21/r21r1/nexus-nav-event.mjs
          node --check examples/r21/r21r1/www-closeout-receipt.mjs
      - name: Check Android GNSS companion reference present and non-empty
        run: test -s examples/r21/r21r1/android-gnss-companion/AstraNavGnssCompanion.kt
      - name: Check R21R1 JSON schemas parse
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const p of ['schema/r21/r21r1/nexus-nav-fix-v1.schema.json','schema/r21/r21r1/nexus-offline-pack-v1.schema.json','schema/r21/r21r1/nexus-nav-event-v1.schema.json']) JSON.parse(fs.readFileSync(p,'utf8'));"
      - name: Run R21R1 GNSS provenance fail-closed fixtures
        continue-on-error: true
        run: |
          set +e
          out=$(node --test tests/r21/r21r1/nexus-nav-fix.test.mjs 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error title=R21R1 GNSS fixtures failed::$(printf '%s' "$out" | grep -E 'not ok|SyntaxError|Cannot find|ERR_|AssertionError' | head -n 25 | tr '\n' ' ' | cut -c1-900)"
            touch /tmp/r21r1-gate-failed
          fi
          exit "$status"
      - name: Run R21R1 offline pack gate fixtures
        continue-on-error: true
        run: |
          set +e
          out=$(node --test tests/r21/r21r1/offline-pack.test.mjs 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error title=R21R1 offline pack fixtures failed::$(printf '%s' "$out" | grep -E 'not ok|SyntaxError|Cannot find|ERR_|AssertionError' | head -n 25 | tr '\n' ' ' | cut -c1-900)"
            touch /tmp/r21r1-gate-failed
          fi
          exit "$status"
      - name: Run R21R1 photo tile provenance gate fixtures
        continue-on-error: true
        run: |
          set +e
          out=$(node --test tests/r21/r21r1/photo-tile-provenance.test.mjs 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error title=R21R1 photo tile provenance fixtures failed::$(printf '%s' "$out" | grep -E 'not ok|SyntaxError|Cannot find|ERR_|AssertionError' | head -n 25 | tr '\n' ' ' | cut -c1-900)"
            touch /tmp/r21r1-gate-failed
          fi
          exit "$status"
      - name: Run R21R1 node navigation event contract fixtures
        continue-on-error: true
        run: |
          set +e
          out=$(node --test tests/r21/r21r1/nexus-nav-event.test.mjs 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error title=R21R1 nav event fixtures failed::$(printf '%s' "$out" | grep -E 'not ok|SyntaxError|Cannot find|ERR_|AssertionError' | head -n 25 | tr '\n' ' ' | cut -c1-900)"
            touch /tmp/r21r1-gate-failed
          fi
          exit "$status"
      - name: Run R21R1 WWW closeout receipt fixtures
        continue-on-error: true
        run: |
          set +e
          out=$(node --test tests/r21/r21r1/www-closeout-receipt.test.mjs 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error title=R21R1 WWW closeout receipt fixtures failed::$(printf '%s' "$out" | grep -E 'not ok|SyntaxError|Cannot find|ERR_|AssertionError' | head -n 25 | tr '\n' ' ' | cut -c1-900)"
            touch /tmp/r21r1-gate-failed
          fi
          exit "$status"
      - name: Verify ASTRA-NAV P0 production fileset manifest hashes (WP-G1)
        run: |
          set +e
          out=$(node scripts/r21r1/verify-production-fileset-manifest.mjs 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Production fileset manifest verification failed::$(printf '%s' "$out" | tail -n 5 | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
      - name: Enforce R21R1 fail-closed gate aggregation
        if: always()
        run: |
          if [ -f /tmp/r21r1-gate-failed ]; then
            echo 'Mindestens ein R21R1-Test-Gate ist fehlgeschlagen (siehe Annotationen).'
            exit 1
          fi
