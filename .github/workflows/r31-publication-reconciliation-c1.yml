name: r31-publication-reconciliation-c1
on:
  pull_request:
    paths:
      - 'research/r31/framework-publication-sync-20261116/**'
      - '.github/workflows/r31-publication-reconciliation-c1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r31-offline-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run source-locked C1 protocol falsification fixtures
        run: python -m unittest discover -s research/r31/framework-publication-sync-20261116/tests -p 'test_*.py' -v
      - name: Verify source-only executable can never deploy
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("research/r31/framework-publication-sync-20261116")
          src = (root / "src" / "r31_reconcile.py").read_text(encoding="utf8")
          assert "www_write_performed" in src
          assert "False" in src
          assert "C1_DESCRIPTIVE_ONLY" in src
          assert "SENSITIVE_TERMS" in src
          print("R31_OFFLINE_C1_SOURCE_CHECK=PASS; WWW_DEPLOY=NOT_EXECUTED")
          PY
