name: validate-a83-framework-hardening

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install pinned A83 test dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-a83-test.txt
      - name: Compile all Python sources
        run: python3 -m compileall -q scripts tests
      - name: Run A83 pytest suite
        run: python3 -m pytest -q tests/test_a83_handoff.py
      - name: Reproduce A83
        run: python3 scripts/reproduce_a83.py --root .
      - name: Verify A83 artifact binding
        run: python3 scripts/verify_a83_artifact_binding.py --root .
      - name: Validate existing communication ledger
        run: python3 scripts/validate_scientific_ledger.py --root .
      - name: Validate existing scientific communication fixtures
        run: python3 scripts/validate_scientific_communication.py --fixtures validation/scientific-communication-negative-fixtures-v1.jsonl
      - name: Parse A83 schema and machine artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool schema/A83_handoff_envelope_v1.schema.json >/dev/null
          python3 -m json.tool docs/phase2/A83_FRAMEWORK_INVENTORY_AND_GAP_REPORT_v1.0.json >/dev/null
          python3 -m json.tool validation/A83_WEAKNESS_AND_OPEN_QUESTIONS_AUDIT_v1.0.json >/dev/null
          python3 -m json.tool validation/A83_ARTIFACT_BINDING_v1.0.json >/dev/null
          python3 -m json.tool validation/A83_FINAL_STATUS_v1.0.json >/dev/null
          python3 -m json.tool docs/phase2/NEXUS_OMEGA_A84_INDEPENDENT_GITHUB_VALIDATION_RETURN_20260831_R0_HANDSHAKE.json >/dev/null
