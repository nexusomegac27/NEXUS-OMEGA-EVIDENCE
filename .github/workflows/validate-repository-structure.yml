name: Validate repository structure

on:
  schedule:
    - cron: '37 6 * * *'  # daily UTC, read-only existing structure workflow
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-repository-structure:
    name: validate-repository-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure F01 PINNED_COMMIT object
        shell: bash
        run: |
          set -euo pipefail
          # Default checkout depth=1 omits ancestor tip pin used by
          # SourceResolver / test_nexus_github_exchange_chain (COMMIT_OBJECT_MISSING).
          PIN=ee73769c966b22887fafbc755edf7c64d1a537e1
          git fetch --depth=1 origin "${PIN}"
          git cat-file -t "${PIN}" | grep -qx commit
      - name: Validate repository-order contract
        run: python scripts/validate_repository_structure.py --root .
      - name: Run repository-structure tests
        run: python -m unittest tests.test_repository_structure tests.test_external_agent_pr tests.test_preentry_lab
      - name: Verify AXIOM expert detached SHA256 and Git blob handshake (12 fail-closed tests)
        run: python -m unittest tests.test_expert_hash_handshake_v1
      - name: Verify NEXUS Task Anchor V1 and fail-closed drift reset (22 unit tests)
        run: python -m unittest tests.test_task_anchor_norm_v1
      - name: Verify public C1 ticker using native Node unit tests (no network)
        run: node --test tests/nexus-public-update-ticker.test.mjs

      - name: Verify NEXUS ICEBERG C1 homepage source (offline)
        run: node --test tests/nexus-omega-iceberg-homepage.test.mjs

      - name: NEXUS Repository Steward source-exact inventory (read-only)
        run: |
          python scripts/nexus_repository_steward.py --root . --output "$RUNNER_TEMP/nexus-repository-tree.jsonl" --fail-on-integrity > "$RUNNER_TEMP/nexus-repository-summary.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/nexus-repository-summary.json")); print("## NEXUS Repository Steward"); print("Source commit:",d["source_commit"]); print("Tracked files:",d["tracked_file_count"]); print("Tracked directories:",d["directory_count"]); print("Registered research lanes:",d["registered_lane_count"]); print("Integrity findings:",d["integrity_error_count"]); print("Legacy naming reviews:",d["review_counts"]); print("MCP Node-Bus not assessed by CI")' >> "$GITHUB_STEP_SUMMARY"
      - name: NEXUS Repository Steward deterministic negative fixtures
        run: python -m unittest tests.test_nexus_repository_steward -v
      - name: GitHub-only Expert Exchange chain (G1–G5/G8/G9 offline fail-closed)
        run: python -m unittest tests.test_nexus_github_exchange_chain -v
      - name: Expertenkodex V1 header + C01–C16 adversarial (offline fail-closed)
        run: python -m unittest tests.test_nexus_expertenkodex_v1 -v
