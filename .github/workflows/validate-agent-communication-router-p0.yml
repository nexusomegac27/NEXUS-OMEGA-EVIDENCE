name: validate-agent-communication-router-p0

# Isolated P0 CI for NEXUS Document Router / Agent Communication lane.
# C1_DESCRIPTIVE_ONLY · no tokens · no external writes · no Hostinger.

on:
  push:
    branches:
      - "codex/github-expert-exchange-foundation-*"
      - "codex/mistral-p0-original-python-hard-repair-*"
    paths:
      - "scripts/nexus_document_router.py"
      - "scripts/nexus_github_exchange_chain.py"
      - "tests/test_nexus_document_router.py"
      - ".github/workflows/validate-agent-communication-router-p0.yml"
  pull_request:
    paths:
      - "scripts/nexus_document_router.py"
      - "scripts/nexus_github_exchange_chain.py"
      - "tests/test_nexus_document_router.py"
      - ".github/workflows/validate-agent-communication-router-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-p0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Router unit suite
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/scripts" \
            python3 -m unittest discover -s tests -p 'test_nexus_document_router.py' -v
